    /* OUTER BEAM */
    .beam-outer {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      height: 500px;
      background: radial-gradient(ellipse at 50% 100%, rgba(0, 180, 255, 0.3) 0%, rgba(0, 180, 255, 0.05) 60%, transparent 100%);
      filter: blur(50px);
      animation: beamPulse 5s ease-in-out infinite;
      z-index: 0;
    }

    /* INNER BEAM */
    .beam-inner {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 380px;
      height: 400px;
      background: radial-gradient(ellipse at 50% 100%, rgba(0, 255, 255, 0.7) 0%, rgba(0, 255, 255, 0.1) 50%, transparent 100%);
      filter: blur(30px);
      animation: beamPulse 5s ease-in-out infinite;
      z-index: 1;
    }

    @keyframes beamPulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.7; }
    }

    /* BASE GLOW RING */
    .beam-ring {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 540px;
      height: 25px;
      background: radial-gradient(circle, rgba(0, 255, 255, 0.7) 0%, rgba(0, 255, 255, 0) 80%);
      filter: blur(12px);
      z-index: 2;
    }

    /* Cube */
    .cube-container {
      width: 320px;
      height: 320px;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      animation: spin3D 22s linear infinite;
      position: relative;
      z-index: 3;
    }

    .cube-face {
      position: absolute;
      width: 320px;
      height: 320px;
      background: rgba(0, 255, 255, 0.08);
      box-shadow:
        inset 0 0 100px rgba(0, 255, 255, 0.15), /* subtle inner glow */
        0 0 70px rgba(0, 255, 255, 0.3);         /* better outer edge glow */
      border-radius: 12px; /* Rounded */
      border: 3px solid #00ffff;
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      backface-visibility: hidden;
    }

    /* ICON CIRCLE → pure neon glow ring */
    .icon-circle {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: none;
      box-shadow:
        0 0 50px rgba(0, 255, 255, 0.9),
        0 0 100px rgba(0, 255, 255, 0.5),
        inset 0 0 15px rgba(0, 255, 255, 0.3); /* slight inner glow */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* BIG ICON → Polished BRIGHT RED GLOW */
    .icon-circle img {
      width: 250px;
      height: 180px;
      filter:
        drop-shadow(0 0 40px rgba(255, 0, 0, 1))
        drop-shadow(0 0 80px rgba(255, 0, 0, 0.7));
      transition: filter 0.3s ease; /* optional: for smooth on hover */
    }

    /* Face Positions */
    .front  { transform: rotateY(0deg)   translateZ(160px); }
    .back   { transform: rotateY(180deg) translateZ(160px); }
    .right  { transform: rotateY(90deg)  translateZ(160px); }
    .left   { transform: rotateY(-90deg) translateZ(160px); }
    .top    { transform: rotateX(90deg)  translateZ(160px); }
    .bottom { transform: rotateX(-90deg) translateZ(160px); }

    @keyframes spin3D {
      0%   { transform: rotateX(0deg) rotateY(0deg); }
      100% { transform: rotateX(360deg) rotateY(360deg); }
    }
  </style>
