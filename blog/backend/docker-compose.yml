services:
  mysql:
    image: mysql:8.0
    container_name: supershyft-blog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: supershyft_local
      MYSQL_DATABASE: supershyft_blog
    ports:
      - "3307:3306"
    volumes:
      - supershyft_blog_data:/var/lib/mysql

volumes:
  supershyft_blog_data:
